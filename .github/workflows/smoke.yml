name: Smoke test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install test dependencies
        run: npm install --no-save puppeteer serve

      - name: Start static server
        run: |
          npx serve -l 4173 . &
          for i in $(seq 1 15); do
            if curl -sf http://localhost:4173/ > /dev/null; then
              echo "Server is up"
              exit 0
            fi
            sleep 1
          done
          echo "Server did not start within 15s"
          exit 1

      - name: Run smoke test
        run: node tests/smoke.js

      - name: Run data and browser regressions
        run: |
          node --test tests/regression.js
          node tests/browser-regression.js
